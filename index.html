<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VoxGlobal V5.8 - Official</title>
    <style>
        :root { 
            --p: #2563EB; --bg: #F8FAFC; --txt: #1E293B; 
            --adn: #8B5CF6; --danger: #EF4444; --ok: #10B981; --gold: #D4AF37; 
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; border-radius: 12px; transition: all 0.2s ease; }
        body { margin: 0; background: var(--bg); color: var(--txt); overflow: hidden; height: 100vh; }

        /* VOX MODAL */
        #vox-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.8); z-index: 10000; justify-content: center; align-items: center; 
            backdrop-filter: blur(8px);
        }
        .modal-content { 
            background: white; padding: 30px; width: 90%; max-width: 400px; text-align: center; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.3); border-top: 6px solid var(--p);
        }

        /* HEADER */
        header { 
            background: white; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #E2E8F0; height: 70px; z-index: 1000;
        }
        .logo { font-weight: 900; color: var(--p); font-size: 1.3rem; cursor: pointer; }

        /* VISTAS */
        .vista { display: none; height: calc(100vh - 70px); overflow-y: auto; padding: 20px; }
        .activa { display: block; }

        /* REGISTRO OBLIGATORIO */
        #v-auth { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #EEF2FF; z-index: 5000; position: fixed; inset: 0; }
        .auth-card { background: white; padding: 35px; width: 95%; max-width: 420px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border: 1px solid #E0E7FF; }
        .auth-input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #CBD5E1; font-size: 14px; outline: none; }
        .auth-input:focus { border-color: var(--p); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .btn-social { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #DDD; background: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* EDITOR UNIFICADO (Visibilidad Corregida) */
        #editor-wrapper { 
            background: white; border: 1px solid #E2E8F0; display: flex; flex-direction: column; 
            height: calc(100vh - 220px); overflow-y: auto; position: relative;
        }
        #e-full { 
            padding: 25px; min-height: 100%; outline: none; font-size: 18px; line-height: 1.7; color: #334155;
            word-wrap: break-word; overflow-wrap: break-word;
        }
        #e-full h1 { margin: 0 0 20px 0; color: var(--p); border-bottom: 2px solid #F1F5F9; padding-bottom: 10px; font-size: 28px; }

        /* FOOTER & HERRAMIENTAS */
        .footer { 
            position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; 
            border-top: 4px solid var(--p); display: flex; flex-wrap: wrap; gap: 8px; z-index: 1100;
            transition: transform 0.3s ease;
        }
        .footer.oculto { transform: translateY(100%); }
        .btn-tool { flex: 1; padding: 12px; border: none; color: white; font-weight: 800; cursor: pointer; font-size: 11px; text-transform: uppercase; }
        
        .toggle-tools { 
            position: absolute; top: -45px; right: 20px; background: var(--p); color: white; 
            border: none; padding: 10px 15px; border-radius: 10px 10px 0 0; font-weight: bold; cursor: pointer;
        }

        /* SIDEBAR */
        .sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: white; z-index: 2000; border-right: 2px solid var(--p); padding: 25px; }
        .sidebar.open { left: 0; }
        .sidebar button { width: 100%; padding: 16px; text-align: left; border: none; background: none; border-bottom: 1px solid #F1F5F9; font-weight: 700; cursor: pointer; }

        .btn-plus { position: fixed; bottom: 160px; right: 30px; width: 70px; height: 70px; border-radius: 50%; background: var(--p); color: white; border: none; font-size: 40px; box-shadow: 0 10px 25px rgba(37,99,235,0.4); cursor: pointer; z-index: 900; }
    </style>
</head>
<body>

    <div id="vox-modal" onclick="closeVox()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="font-weight:900; color:var(--p); margin-bottom:10px; letter-spacing:1px;">VOXGLOBAL</div>
            <div id="modal-msg" style="color: #475569; font-size: 14px; line-height: 1.5;"></div>
            <button onclick="closeVox()" style="margin-top:20px; width:100%; padding:12px; background:var(--p); color:white; border:none; font-weight:bold;">CONTINUAR</button>
        </div>
    </div>

    <div id="v-auth">
        <div class="auth-card" id="auth-main">
            <h2 style="color:var(--p); margin:0 0 10px 0; font-weight:900;">Acceso al Trabajo</h2>
            <p style="font-size:13px; color:#64748B; margin-bottom:25px;">Regístrate para habilitar el panel de edición.</p>
            
            <button class="btn-social" onclick="socialAuth('Google')">🌐 Continuar con Google</button>
            <button class="btn-social" onclick="socialAuth('Facebook')" style="background:#1877F2; color:white; border:none;">👥 Facebook</button>
            
            <div style="margin:20px 0; font-size:10px; color:#CBD5E1; letter-spacing:2px; text-align:center;">O USA TUS CREDENCIALES</div>

            <input type="text" id="log-user" class="auth-input" placeholder="Email o Teléfono">
            <input type="password" id="log-pass" class="auth-input" placeholder="Contraseña">
            
            <button onclick="intentarAcceso()" style="width:100%; padding:15px; background:var(--p); color:white; border:none; font-weight:900; margin-top:10px;">INGRESAR</button>
            
            <button onclick="mostrarOlvido()" style="background:none; border:none; color:var(--p); font-size:12px; margin-top:15px; cursor:pointer; font-weight:bold;">¿Olvidaste tu contraseña?</button>
        </div>

        <div class="auth-card" id="auth-forgot" style="display:none;">
            <h2 style="color:var(--p); margin:0 0 10px 0;">Recuperar Cuenta</h2>
            <p style="font-size:13px; color:#64748B; margin-bottom:20px;">Elige dónde recibir tu código de acceso:</p>
            
            <select id="recover-method" class="auth-input">
                <option value="WhatsApp">WhatsApp</option>
                <option value="SMS">Mensaje de Texto (SMS)</option>
                <option value="Email">Correo Electrónico</option>
            </select>
            <input type="text" id="recover-val" class="auth-input" placeholder="Número o Email">
            
            <button onclick="enviarCodigo()" style="width:100%; padding:15px; background:var(--ok); color:white; border:none; font-weight:900;">ENVIAR CÓDIGO</button>
            <button onclick="volverAuth()" style="background:none; border:none; color:#64748B; font-size:12px; margin-top:15px; cursor:pointer;">Regresar al inicio</button>
        </div>
    </div>

    <header id="app-header" style="display:none;">
        <button onclick="toggleMenu()" style="background:none; border:none; font-size:26px; color:var(--p);">☰</button>
        <div class="logo" id="main-logo">VOXGLOBAL</div>
        <div id="status-tag" style="font-size:10px; font-weight:bold; background:var(--gold); color:white; padding:3px 8px;">PRO</div>
    </header>

    <nav id="sidebar" class="sidebar">
        <h2 style="color:var(--p)">Menú Pro</h2>
        <button onclick="irA('v-hub')">📂 Proyectos Guardados</button>
        <button onclick="cerrarSesion()" style="color:var(--danger); margin-top:30px;">🚪 Cerrar Sesión Segura</button>
    </nav>

    <div id="v-hub" class="vista">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="margin:0;">Mis Archivos</h2>
            <span id="user-display" style="font-size:12px; color:var(--p); font-weight:bold;"></span>
        </div>
        <div id="hub-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:15px;"></div>
        <button id="btn-nuevo" class="btn-plus" onclick="nuevoProyecto()" style="display:none;">+</button>
    </div>

    <div id="v-edit" class="vista">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <button onclick="irA('v-hub')" style="border:none; background:none; color:var(--p); font-weight:bold;">⬅ PROYECTOS</button>
            <span style="font-size:11px; color:#94A3B8;">EDITOR UNIFICADO V5.8</span>
        </div>

        <div id="editor-wrapper">
            <div id="e-full" contenteditable="true">
                <h1 id="inner-title">Título del Proyecto</h1>
                <div>Escribe o pega aquí el contenido...</div>
            </div>
        </div>

        <div class="footer" id="main-tools">
            <button class="toggle-tools" onclick="toggleHerramientas()" id="btn-h-tgl">OCULTAR</button>
            <button class="btn-tool" style="background:var(--adn);" onclick="voxSay('ADN Contextualizado para este hilo de trabajo.')">🧬 ADN</button>
            <button class="btn-tool" style="background:var(--danger);" onclick="voxSay('🎤 Microfono activado... (Simulado)')">🎤</button>
            <button class="btn-tool" style="background:var(--p);" onclick="leerTodo()">🔊 OÍR</button>
            <button class="btn-tool" style="background:var(--ok); flex:2;" onclick="guardarTodo()">💾 GUARDAR TODO</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('vox_v58_db')) || [];
        let session = JSON.parse(localStorage.getItem('vox_session')) || null;

        // --- MANEJO DE VENTANAS (MODAL) ---
        function voxSay(msg) {
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('vox-modal').style.display = 'flex';
            setTimeout(closeVox, 3000); // Auto-cierre de seguridad
        }
        function closeVox() { document.getElementById('vox-modal').style.display = 'none'; }

        // --- AUTENTICACIÓN Y REGISTRO ---
        function intentarAcceso() {
            const user = document.getElementById('log-user').value;
            const pass = document.getElementById('log-pass').value;
            
            if(!user || !pass) return voxSay("Debes completar usuario y contraseña para activar el registro.");
            
            session = { id: user, isPro: true };
            localStorage.setItem('vox_session', JSON.stringify(session));
            iniciarApp();
        }

        function socialAuth(plataforma) {
            voxSay("Vinculando con " + plataforma + "...");
            session = { id: plataforma + "_User", isPro: true };
            localStorage.setItem('vox_session', JSON.stringify(session));
            setTimeout(iniciarApp, 1500);
        }

        function iniciarApp() {
            document.getElementById('v-auth').style.display = 'none';
            document.getElementById('app-header').style.display = 'flex';
            document.getElementById('btn-nuevo').style.display = 'block';
            document.getElementById('user-display').innerText = session.id;
            irA('v-hub');
        }

        function cerrarSesion() {
            localStorage.removeItem('vox_session');
            location.reload();
        }

        // --- RECUPERACIÓN ---
        function mostrarOlvido() {
            document.getElementById('auth-main').style.display = 'none';
            document.getElementById('auth-forgot').style.display = 'block';
        }
        function volverAuth() {
            document.getElementById('auth-main').style.display = 'block';
            document.getElementById('auth-forgot').style.display = 'none';
        }
        function enviarCodigo() {
            const met = document.getElementById('recover-method').value;
            const val = document.getElementById('recover-val').value;
            if(!val) return voxSay("Ingresa el destino del código.");
            voxSay("Código enviado vía " + met + ". Revisa tu bandeja.");
            setTimeout(volverAuth, 2000);
        }

        // --- NAVEGACIÓN ---
        function irA(v) {
            document.querySelectorAll('.vista').forEach(x => x.classList.remove('activa'));
            document.getElementById(v).classList.add('activa');
            if(v === 'v-hub') renderHub();
            toggleMenu(false);
        }
        function toggleMenu(force) {
            const s = document.getElementById('sidebar');
            if(force === false) s.classList.remove('open');
            else s.classList.toggle('open');
        }

        // --- EDITOR Y VISIBILIDAD (AUTO-SCROLL) ---
        const editor = document.getElementById('e-full');
        const wrapper = document.getElementById('editor-wrapper');

        editor.addEventListener('input', () => {
            // Asegura que al escribir, el scroll baje automáticamente si el cursor sale de vista
            wrapper.scrollTop = wrapper.scrollHeight;
        });

        function toggleHerramientas() {
            const footer = document.getElementById('main-tools');
            const btn = document.getElementById('btn-h-tgl');
            footer.classList.toggle('oculto');
            btn.innerText = footer.classList.contains('oculto') ? "MOSTRAR" : "OCULTAR";
        }

        // --- LÓGICA DE DATOS ---
        function renderHub() {
            const grid = document.getElementById('hub-grid');
            grid.innerHTML = '';
            const misDatos = db.filter(x => x.userId === session.id);
            
            misDatos.sort((a,b) => b.id - a.id).forEach(x => {
                const card = document.createElement('div');
                card.style = "background:white; padding:15px; border:1px solid #E2E8F0; cursor:pointer;";
                card.onclick = () => {
                    document.getElementById('e-full').innerHTML = x.content;
                    document.getElementById('v-edit').dataset.id = x.id;
                    irA('v-edit');
                };
                card.innerHTML = `<h4 style="margin:0; color:var(--p)">${x.title}</h4><p style="font-size:11px; color:#94A3B8; margin:5px 0 0 0;">ID: ${x.id.toString().slice(-5)}</p>`;
                grid.appendChild(card);
            });
        }

        function guardarTodo() {
            const id = document.getElementById('v-edit').dataset.id || Date.now().toString();
            const fullContent = document.getElementById('e-full').innerHTML;
            const title = document.getElementById('inner-title').innerText || "Sin Título";
            
            db = db.filter(x => x.id !== id);
            db.push({ id, title, content: fullContent, userId: session.id });
            localStorage.setItem('vox_v58_db', JSON.stringify(db));
            
            voxSay("¡Sincronizado! El proyecto está a salvo en tu cuenta.");
            irA('v-hub');
        }

        function nuevoProyecto() {
            document.getElementById('e-full').innerHTML = `<h1 id="inner-title">Nuevo Proyecto</h1><div>Escribe aquí...</div>`;
            delete document.getElementById('v-edit').dataset.id;
            irA('v-edit');
        }

        function leerTodo() {
            const text = document.getElementById('e-full').innerText;
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        }

        // MODO DIOS (PIN 1010)
        let godHold;
        document.getElementById('main-logo').onmousedown = document.getElementById('main-logo').ontouchstart = () => {
            godHold = setTimeout(() => {
                if(prompt("ADMIN PIN:") === "1010") voxSay("Acceso administrativo concedido.");
            }, 5000);
        };

        window.onload = () => { if(session) iniciarApp(); };
    </script>
</body>
</html>
