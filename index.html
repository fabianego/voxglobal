<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VoxGlobal V5.7 - Secure</title>
    <style>
        :root { 
            --p: #2563EB; --bg: #F8FAFC; --txt: #1E293B; 
            --adn: #8B5CF6; --danger: #EF4444; --ok: #10B981; --gold: #D4AF37; 
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; border-radius: 12px; }
        body { margin: 0; background: var(--bg); color: var(--txt); overflow-x: hidden; }

        /* VOX MODAL MEJORADO (Auto-cierre) */
        #vox-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.7); z-index: 9999; justify-content: center; align-items: center; 
            backdrop-filter: blur(5px);
        }
        .modal-content { 
            background: white; padding: 30px; width: 85%; max-width: 400px; text-align: center; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.2); border-top: 6px solid var(--p);
            animation: modalPop 0.3s cubic-bezier(0.17, 0.89, 0.32, 1.28);
        }
        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* UI BASE */
        header { background: white; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E2E8F0; height: 70px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--p); font-size: 1.3rem; cursor: pointer; }
        .badge-pro { background: var(--gold); color: white; padding: 4px 8px; font-size: 10px; border-radius: 4px; margin-left: 5px; }
        
        .vista { display: none; padding: 20px; max-width: 850px; margin: 0 auto; min-height: 80vh; }
        .activa { display: block; }

        /* LOGIN WALL */
        #v-auth { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; text-align: center; }
        .auth-card { background: white; padding: 40px; border: 1px solid #E2E8F0; width: 100%; max-width: 400px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

        /* EDITOR & CARDS */
        .card { background: white; padding: 20px; border: 1px solid #E2E8F0; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
        .card:hover { border-color: var(--p); transform: translateY(-3px); }
        #editor-container { background: white; border: 1px solid #E2E8F0; margin-top: 15px; }
        #e-title { padding: 20px; font-size: 24px; font-weight: 800; color: var(--p); border-bottom: 1px solid #F1F5F9; outline: none; }
        #e-body { padding: 20px; min-height: 400px; outline: none; font-size: 18px; line-height: 1.6; }

        /* FOOTER TOOLBAR */
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 12px; border-top: 3px solid var(--p); display: flex; flex-wrap: wrap; gap: 8px; z-index: 1100; }
        .btn-tool { flex: 1; padding: 12px; border: none; color: white; font-weight: 800; cursor: pointer; font-size: 12px; }

        /* SIDEBAR */
        .sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: white; z-index: 2000; transition: 0.3s; border-right: 2px solid var(--p); padding: 25px; }
        .sidebar.open { left: 0; }
        .sidebar button { width: 100%; padding: 15px; text-align: left; border: none; background: none; border-bottom: 1px solid #F1F5F9; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div id="vox-modal" onclick="closeVox()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="font-weight:900; color:var(--p); margin-bottom:10px;">VoxGlobal</div>
            <div id="modal-msg" style="color: #475569;"></div>
            <button onclick="closeVox()" style="margin-top:20px; width:100%; padding:10px; background:var(--p); color:white; border:none; font-weight:bold;">CERRAR</button>
        </div>
    </div>

    <header id="main-header" style="display:none;">
        <button onclick="toggleMenu()" style="background:none; border:none; font-size:24px; color:var(--p);">☰</button>
        <div class="logo" id="main-logo">VOXGLOBAL <span id="tag-pro" class="badge-pro" style="display:none;">PRO</span></div>
        <div id="user-initial" style="background:var(--p); color:white; width:35px; height:35px; display:flex; align-items:center; justify-content:center; font-weight:bold; border-radius:50%;">U</div>
    </header>

    <nav id="sidebar" class="sidebar">
        <h2 style="color:var(--p)">Panel</h2>
        <button onclick="irA('v-hub')">📂 Mis Proyectos</button>
        <button onclick="irA('v-profile')">👤 Mi Suscripción</button>
        <button onclick="descargarRespaldo()">💼 Respaldar Maletín</button>
        <button onclick="cerrarSesion()" style="color:var(--danger); margin-top:20px;">🚪 Cerrar Sesión</button>
    </nav>

    <div id="v-auth" class="vista activa">
        <div class="auth-card">
            <h1 style="color:var(--p); margin-bottom:5px;">VoxGlobal</h1>
            <p style="font-size:14px; color:#64748B; margin-bottom:25px;">Ingresa para acceder a tus datos seguros</p>
            <input type="text" id="reg-name" placeholder="Tu Nombre" style="width:100%; padding:15px; margin-bottom:10px; border:1px solid #DDD;">
            <input type="email" id="reg-mail" placeholder="Tu Email" style="width:100%; padding:15px; margin-bottom:20px; border:1px solid #DDD;">
            <button onclick="iniciarSesion()" style="width:100%; padding:15px; background:var(--ok); color:white; border:none; font-weight:900; cursor:pointer;">ACCEDER AL CAMPO DE TRABAJO</button>
            <p style="font-size:11px; color:#94A3B8; margin-top:15px;">Al ingresar aceptas que tus datos sean privados y vinculados a tu cuenta.</p>
        </div>
    </div>

    <div id="v-hub" class="vista">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="margin:0;">Mis Proyectos</h2>
            <div id="status-tag" style="font-size:12px; font-weight:bold;"></div>
        </div>
        <input type="text" id="search" oninput="renderHub()" placeholder="🔍 Buscar en mis archivos..." style="width:100%; padding:15px; border:2px solid #E2E8F0; margin-bottom:20px;">
        <div id="hub-grid"></div>
        <button onclick="nuevo()" style="position:fixed; bottom:140px; right:30px; width:65px; height:65px; border-radius:50%; background:var(--p); color:white; border:none; font-size:35px; box-shadow:0 10px 20px rgba(0,0,0,0.1);">+</button>
    </div>

    <div id="v-edit" class="vista">
        <button onclick="irA('v-hub')" style="background:none; border:none; color:var(--p); font-weight:bold; cursor:pointer; margin-bottom:15px;">⬅ VOLVER</button>
        <div id="editor-container">
            <div id="e-title" contenteditable="true" placeholder="Título..."></div>
            <div id="e-body" contenteditable="true" placeholder="Contenido del proyecto..."></div>
        </div>
        <div class="footer">
            <button class="btn-tool" style="background:var(--adn); flex:0 0 50px;" onclick="voxSay('ADN activo para este proyecto.')">🧬</button>
            <button class="btn-tool" style="background:var(--danger); flex:0 0 50px;" onclick="voxSay('🎤 Escuchando...')">🎤</button>
            <button class="btn-tool" style="background:var(--p);" onclick="leerTexto()">🔊 OÍR</button>
            <button class="btn-tool" style="background:var(--ok); flex:2;" onclick="guardar()">💾 GUARDAR PROYECTO</button>
        </div>
    </div>

    <div id="v-profile" class="vista">
        <div class="auth-card" style="max-width:100%;">
            <h2 id="prof-name">Usuario</h2>
            <p id="prof-mail" style="color:var(--p);"></p>
            <div id="prof-status" style="padding:20px; background:#F1F5F9; margin-top:20px;"></div>
            <button onclick="irA('v-hub')" style="margin-top:20px; border:none; background:var(--p); color:white; padding:10px 20px;">VOLVER AL TRABAJO</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('vox_v5_db')) || [];
        let currentUser = JSON.parse(localStorage.getItem('vox_v5_session')) || null;

        // --- GESTIÓN DE MODALES (Depuración de cierre) ---
        let modalTimer;
        function voxSay(msg) {
            clearTimeout(modalTimer);
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('vox-modal').style.display = 'flex';
            // Auto-cerrar en 2.5 segundos para no interrumpir el flujo
            modalTimer = setTimeout(closeVox, 2500);
        }
        function closeVox() { 
            document.getElementById('vox-modal').style.display = 'none'; 
        }

        // --- SISTEMA DE SESIÓN Y PRIVACIDAD ---
        function iniciarSesion() {
            const name = document.getElementById('reg-name').value;
            const mail = document.getElementById('reg-mail').value;
            if(!name || !mail) return voxSay("Ingresa nombre y correo para continuar.");

            currentUser = { name, mail, isPro: false };
            localStorage.setItem('vox_v5_session', JSON.stringify(currentUser));
            voxSay("Sesión iniciada. Bienvenido " + name);
            checkSession();
        }

        function checkSession() {
            if(currentUser) {
                document.getElementById('v-auth').classList.remove('activa');
                document.getElementById('main-header').style.display = 'flex';
                document.getElementById('prof-name').innerText = currentUser.name;
                document.getElementById('prof-mail').innerText = currentUser.mail;
                document.getElementById('user-initial').innerText = currentUser.name[0].toUpperCase();
                updateUI();
                irA('v-hub');
            } else {
                irA('v-auth');
                document.getElementById('main-header').style.display = 'none';
            }
        }

        function cerrarSesion() {
            currentUser = null;
            localStorage.removeItem('vox_v5_session');
            toggleMenu();
            checkSession();
        }

        // --- LÓGICA DE DATOS PRIVADOS ---
        function renderHub() {
            const grid = document.getElementById('hub-grid');
            const q = document.getElementById('search').value.toLowerCase();
            grid.innerHTML = '';
            
            // FILTRO CRÍTICO: Solo mostrar proyectos que pertenecen al mail actual
            const misDatos = db.filter(x => x.userMail === currentUser.mail);
            const filtrados = misDatos.filter(x => x.t.toLowerCase().includes(q) || x.txt.toLowerCase().includes(q));

            filtrados.sort((a,b) => b.id - a.id).forEach(x => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => {
                    document.getElementById('e-title').innerText = x.t;
                    document.getElementById('e-body').innerText = x.txt;
                    document.getElementById('v-edit').dataset.id = x.id;
                    irA('v-edit');
                };
                card.innerHTML = `<h3>${x.t}</h3><p>${x.txt.substring(0,80)}...</p>`;
                grid.appendChild(card);
            });
        }

        function guardar() {
            const id = document.getElementById('v-edit').dataset.id || Date.now().toString();
            const t = document.getElementById('e-title').innerText.trim() || "Sin Título";
            const txt = document.getElementById('e-body').innerText.trim();
            
            // Guardar con vínculo al usuario actual
            db = db.filter(x => x.id !== id);
            db.push({ id, t, txt, userMail: currentUser.mail });
            localStorage.setItem('vox_v5_db', JSON.stringify(db));
            
            voxSay("Proyecto guardado en tu cuenta.");
            irA('v-hub');
        }

        // --- MODO DIOS (Anualidad/PRO) ---
        let godTouch;
        document.getElementById('main-logo').ontouchstart = () => {
            godTouch = setTimeout(() => {
                if(prompt("PIN DE AUTORIZACIÓN:") === "1010") {
                    currentUser.isPro = true;
                    localStorage.setItem('vox_v5_session', JSON.stringify(currentUser));
                    updateUI();
                    voxSay("MODO DIOS: Suscripción PRO Activada (Libre de anuncios)");
                }
            }, 3000);
        };
        document.getElementById('main-logo').ontouchend = () => clearTimeout(godTouch);

        // --- NAVEGACIÓN Y EXTRAS ---
        function irA(v) {
            document.querySelectorAll('.vista').forEach(x => x.classList.remove('activa'));
            document.getElementById(v).classList.add('activa');
            if(v === 'v-hub') renderHub();
            document.getElementById('sidebar').classList.remove('open');
        }

        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }

        function updateUI() {
            const tag = document.getElementById('tag-pro');
            const label = document.getElementById('prof-status');
            const statusTag = document.getElementById('status-tag');

            if(currentUser.isPro) {
                tag.style.display = 'inline-block';
                statusTag.innerText = "CUENTA PRO";
                statusTag.style.color = "var(--gold)";
                label.innerHTML = "<b>Estado:</b> PRO ACTIVO<br>Renovación: 06/04/2027";
            } else {
                tag.style.display = 'none';
                statusTag.innerText = "MODO GRATUITO";
                statusTag.style.color = "#94A3B8";
                label.innerHTML = "<b>Estado:</b> Gratuito (Con Publicidad)<br>Valor Anualidad: $500.00 MXN";
            }
        }

        function nuevo() {
            document.getElementById('e-title').innerText = '';
            document.getElementById('e-body').innerText = '';
            delete document.getElementById('v-edit').dataset.id;
            irA('v-edit');
        }

        function leerTexto() { window.speechSynthesis.speak(new SpeechSynthesisUtterance(document.getElementById('e-body').innerText)); }
        
        function descargarRespaldo() {
            const misDatos = db.filter(x => x.userMail === currentUser.mail);
            const blob = new Blob([JSON.stringify(misDatos)], {type:'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `Vox_Respaldo_${currentUser.name}.json`; a.click();
        }

        window.onload = checkSession;
    </script>
</body>
</html>
