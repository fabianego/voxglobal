<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VoxGlobal Pro V5.0</title>
    <style>
        :root { --p: #2563EB; --bg: #F8FAFC; --txt: #1E293B; --adn: #8B5CF6; --danger: #EF4444; --ok: #10B981; }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; border-radius: 12px; }
        body { margin: 0; background: var(--bg); color: var(--txt); }
        
        /* HEADER & NAVIGATION */
        header { background: white; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #E2E8F0; position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; color: var(--p); cursor: pointer; user-select: none; font-size: 1.1rem; }
        
        /* VIEWS */
        .vista { display: none; padding: 15px; max-width: 800px; margin: 0 auto; }
        .activa { display: block; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* EDITOR CORE */
        #editor-shell { background: white; padding: 20px; border: 1px solid #E2E8F0; min-height: 450px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        #e-title { font-size: 24px; font-weight: 800; color: var(--p); border: none; outline: none; margin-bottom: 10px; width: 100%; border-bottom: 2px solid #F1F5F9; padding-bottom: 5px; }
        #e-body { font-size: 17px; min-height: 380px; outline: none; line-height: 1.6; white-space: pre-wrap; }
        [contenteditable]:empty:before { content: attr(placeholder); color: #CBD5E1; }

        /* ADN PANEL (PER PROJECT) */
        #adn-box { display: none; background: #F5F3FF; border: 2px solid var(--adn); padding: 15px; margin-bottom: 15px; }
        #adn-text { width: 100%; height: 80px; border: 1px solid #DDD; padding: 10px; font-size: 13px; resize: none; margin-top: 8px; }

        /* TOOLBAR DINÁMICA */
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 12px; border-top: 3px solid var(--p); display: flex; flex-wrap: wrap; gap: 8px; z-index: 1100; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .footer.hidden { transform: translateY(85%); }
        .btn-toggle { position: absolute; top: -35px; right: 20px; background: var(--p); color: white; border: none; padding: 5px 15px; border-radius: 10px 10px 0 0; font-weight: bold; cursor: pointer; }
        
        .btn { flex: 1; padding: 14px; border: none; color: white; font-weight: 800; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-adn { background: var(--adn); flex: 0 0 55px; font-size: 20px; }
        .btn-mic { background: var(--danger); flex: 0 0 55px; font-size: 20px; }
        .btn-p { background: var(--p); } .btn-ok { background: var(--ok); width: 100%; flex: none; font-size: 15px; }

        /* REGISTRO VISTA */
        .reg-card { background: white; border: 3px solid var(--p); padding: 30px; text-align: center; }
        .pts-display { font-size: 40px; font-weight: 900; color: var(--gold); margin: 20px 0; }

        /* HUB CARDS */
        #hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: white; padding: 15px; border: 1px solid #E2E8F0; height: 160px; overflow: hidden; position: relative; cursor: pointer; }
        .card h3 { margin: 0; font-size: 14px; color: var(--p); }
    </style>
</head>
<body>

    <header>
        <button onclick="toggleMenu('m-side')" style="background:none; border:none; font-size:24px; color:var(--p);">☰</button>
        <div class="logo" id="main-logo">VOXGLOBAL PRO V5.0</div>
        <button onclick="irA('v-reg')" style="background:none; border:none; font-size:24px;">👤</button>
    </header>

    <div id="m-side" style="display:none; position:fixed; top:65px; left:10px; background:white; border:2px solid var(--p); z-index:2000; width:220px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
        <button onclick="irA('v-hub')" style="width:100%; padding:15px; border:none; text-align:left; background:none; border-bottom:1px solid #EEE;">📂 Mis Proyectos</button>
        <button onclick="exportarBackup()" style="width:100%; padding:15px; border:none; text-align:left; background:none; border-bottom:1px solid #EEE;">💼 Guardar Maletín</button>
        <button onclick="importarBackup()" style="width:100%; padding:15px; border:none; text-align:left; background:none;">🔄 Cargar Maletín</button>
    </div>

    <div id="v-hub" class="vista activa">
        <input type="text" id="search" oninput="renderHub()" placeholder="🔍 Buscar proyecto..." style="width:100%; padding:15px; margin-bottom:15px; border:2px solid #E2E8F0;">
        <div id="hub-grid"></div>
        <button onclick="nuevoProy()" style="position:fixed; bottom:140px; right:25px; width:65px; height:65px; border-radius:50%; background:var(--p); color:white; border:none; font-size:35px; box-shadow: 0 8px 15px rgba(37,99,235,0.4);">+</button>
    </div>

    <div id="v-edit" class="vista">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <button onclick="irA('v-hub')" style="color:var(--p); font-weight:bold; border:none; background:none;">⬅ ATRÁS</button>
            <button onclick="toggleADN()" style="color:var(--adn); font-weight:bold; border:none; background:none;">🧬 ADN CONTEXTO</button>
        </div>

        <div id="adn-box">
            <strong>ADN DEL PROYECTO:</strong>
            <textarea id="adn-input" placeholder="Define aquí las reglas de este guion o código..."></textarea>
        </div>

        <div id="editor-shell">
            <div id="e-title" contenteditable="true" placeholder="Título del Proyecto..."></div>
            <div id="e-body" contenteditable="true" placeholder="Comienza a escribir..."></div>
        </div>

        <div class="footer" id="toolbar">
            <button class="btn-toggle" onclick="toggleToolbar()">▽</button>
            <button class="btn btn-adn" onclick="alert('ADN Activo: ' + document.getElementById('adn-input').value.substring(0,20) + '...')">🧬</button>
            <button class="btn btn-mic" id="mic-btn" onclick="iniciarDictado()">🎤</button>
            <button class="btn btn-p" onclick="reproducirVoz()">🔊 OÍR</button>
            <button class="btn btn-p" onclick="window.print()">📕 PDF</button>
            <button class="btn btn-ok" onclick="guardarProy()">💾 GUARDAR PROYECTO</button>
        </div>
    </div>

    <div id="v-reg" class="vista">
        <div class="reg-card">
            <h2>Tu Registro VoxGlobal</h2>
            <input type="text" id="user-name" placeholder="Nombre Completo" style="width:100%; padding:15px; margin-bottom:15px; border:2px solid #DDD;">
            <div class="pts-display" id="pts-val">0</div>
            <p>Puntos Acumulados ($<span id="mxn-val">0</span> MXN)</p>
            <button class="btn-ok" onclick="guardarUser()" style="padding:15px;">ACTUALIZAR DATOS</button>
            <p style="font-size:11px; color:#94A3B8; margin-top:20px;">*500 puntos otorga un mes gratis de acceso profesional.</p>
        </div>
        <button onclick="irA('v-hub')" style="width:100%; margin-top:15px; padding:15px; border:none; background:#475569; color:white;">VOLVER AL HUB</button>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('vox_db') || '[]');
        let user = JSON.parse(localStorage.getItem('vox_user') || '{"name":"","pts":0}');
        let godTimer;

        // --- NAVEGACIÓN ---
        function irA(v) { 
            document.querySelectorAll('.vista').forEach(x=>x.classList.remove('activa')); 
            document.getElementById(v).classList.add('activa'); 
            if(v==='v-hub') renderHub();
            closeMenu();
        }

        function toggleMenu(id) {
            const m = document.getElementById(id);
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
        }
        function closeMenu() { document.getElementById('m-side').style.display = 'none'; }

        // --- MODO DIOS (Presión 5 segundos) ---
        const logo = document.getElementById('main-logo');
        logo.onmousedown = logo.ontouchstart = () => {
            godTimer = setTimeout(() => {
                if(prompt("PIN DE ACCESO:") === "1010") {
                    user.pts = 500; updateUI(); alert("MODO DIOS: Acceso total desbloqueado.");
                }
            }, 5000);
        };
        logo.onmouseup = logo.ontouchend = () => clearTimeout(godTimer);

        // --- CORE PROYECTOS ---
        function renderHub() {
            const grid = document.getElementById('hub-grid');
            const q = document.getElementById('search').value.toLowerCase();
            grid.innerHTML = '';
            db.filter(d => d.t.toLowerCase().includes(q)).forEach(d => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => {
                    document.getElementById('e-title').innerText = d.t;
                    document.getElementById('e-body').innerText = d.txt;
                    document.getElementById('adn-input').value = d.adn || '';
                    document.getElementById('v-edit').dataset.id = d.id;
                    irA('v-edit');
                };
                card.innerHTML = `<h3>${d.t}</h3><p style="font-size:11px; color:#666;">${d.txt.substring(0,80)}...</p>`;
                grid.appendChild(card);
            });
        }

        function guardarProy() {
            const id = document.getElementById('v-edit').dataset.id || Date.now();
            const t = document.getElementById('e-title').innerText || "Sin Título";
            const txt = document.getElementById('e-body').innerText;
            const adn = document.getElementById('adn-input').value;
            db = db.filter(x => x.id != id);
            db.push({id, t, txt, adn});
            localStorage.setItem('vox_db', JSON.stringify(db));
            user.pts += 5; updateUI();
            alert("Proyecto Guardado.");
            irA('v-hub');
        }

        function nuevoProy() {
            document.getElementById('e-title').innerText = '';
            document.getElementById('e-body').innerText = '';
            document.getElementById('adn-input').value = '';
            delete document.getElementById('v-edit').dataset.id;
            irA('v-edit');
        }

        // --- HERRAMIENTAS EDITOR ---
        function toggleToolbar() { 
            const t = document.getElementById('toolbar');
            t.classList.toggle('hidden');
            document.querySelector('.btn-toggle').innerText = t.classList.contains('hidden') ? '△' : '▽';
        }
        
        function toggleADN() {
            const b = document.getElementById('adn-box');
            b.style.display = (b.style.display === 'block') ? 'none' : 'block';
        }

        function iniciarDictado() {
            const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!Recognition) return alert("Tu dispositivo no soporta dictado de voz.");
            const rec = new Recognition();
            rec.lang = 'es-MX';
            rec.onstart = () => document.getElementById('mic-btn').style.background = "#000";
            rec.onresult = (e) => { document.getElementById('e-body').innerText += " " + e.results[0][0].transcript; };
            rec.onend = () => document.getElementById('mic-btn').style.background = "var(--danger)";
            rec.start();
        }

        // --- SISTEMA USUARIO ---
        function updateUI() {
            document.getElementById('pts-val').innerText = user.pts;
            document.getElementById('mxn-val').innerText = user.pts;
            document.getElementById('user-name').value = user.name;
            localStorage.setItem('vox_user', JSON.stringify(user));
        }
        function guardarUser() { user.name = document.getElementById('user-name').value; updateUI(); alert("Datos Actualizados."); }
        function reproducirVoz() { window.speechSynthesis.speak(new SpeechSynthesisUtterance(document.getElementById('e-body').innerText)); }
        
        // --- BACKUP ---
        function exportarBackup() {
            const data = JSON.stringify(db);
            const blob = new Blob([data], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "Maletin_VoxGlobal.json";
            a.click();
        }
        function importarBackup() {
            const input = document.createElement('input');
            input.type = 'file';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = ev => {
                    db = JSON.parse(ev.target.result);
                    localStorage.setItem('vox_db', JSON.stringify(db));
                    renderHub(); alert("Maletín Restaurado Correctamente.");
                };
                reader.readAsText(file);
            };
            input.click();
        }

        window.onload = () => { renderHub(); updateUI(); };
    </script>
</body>
</html>
